name: Android Release to Play Store

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # src/config/env.ts는 git에 안 올라가 있어서(.gitignore) CI에서 시크릿으로 복원
      # 값 등록: base64로 인코딩해서 ANDROID_ENV_TS_BASE64 시크릿에 저장
      #   base64 -i src/config/env.ts | gh secret set ANDROID_ENV_TS_BASE64
      - name: Restore src/config/env.ts
        run: echo "${{ secrets.ANDROID_ENV_TS_BASE64 }}" | base64 -d > src/config/env.ts

      # release keystore도 git에 없어서(.gitignore) 시크릿으로 복원
      #   base64 -i android/app/saha-release.keystore | gh secret set ANDROID_KEYSTORE_BASE64
      - name: Restore release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/saha-release.keystore

      # versionCode는 build.gradle에 적힌 값 + 이 워크플로우 실행 횟수(run_number)로 계산해서
      # 항상 이전 업로드보다 커지도록 함 (Play는 versionCode가 항상 증가해야 업로드 허용)
      # -Pandroid.injected.version.code 오버라이드가 이 프로젝트에선 안 먹혀서(defaultConfig에 리터럴로
      # 박혀있는 값이 우선 적용됨), build.gradle 파일 자체의 versionCode 값을 직접 치환하는 방식으로 변경
      - name: Bump versionCode
        run: |
          BASE=$(grep -oP 'versionCode \K[0-9]+' android/app/build.gradle)
          NEW_VERSION_CODE=$((BASE + ${{ github.run_number }}))
          sed -i "s/versionCode [0-9]*/versionCode $NEW_VERSION_CODE/" android/app/build.gradle
          echo "적용된 versionCode: $NEW_VERSION_CODE"

      - name: Build release AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            -PMYAPP_RELEASE_STORE_FILE=saha-release.keystore \
            -PMYAPP_RELEASE_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PMYAPP_RELEASE_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PMYAPP_RELEASE_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"

      # 서비스 계정 JSON 발급: Google Cloud Console에서 서비스 계정 생성 후
      # Play Console > 사용자 및 권한에서 이 계정에 "릴리스 관리자" 권한 부여
      #   cat service-account.json | gh secret set PLAY_SERVICE_ACCOUNT_JSON
      #
      # 사용자에게 보이는 "업데이트 내용"은 distribution/whatsnew/whatsnew-ko-KR 파일에서 가져온다.
      # 배포 전에 이 파일 내용을 그 배포에 맞게 수정해서 커밋하면 된다.
      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.saha.ai
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ github.event.inputs.track }}
          status: completed
          whatsNewDirectory: distribution/whatsnew
